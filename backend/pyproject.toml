[project]
name = "backend"
version = "0.1.0"
description = "브리프코치 백엔드 (S2~S5 에이전트 게이트웨이)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "azure-identity>=1.17",
    "azure-keyvault-secrets>=4.8",
    "openai>=1.40",
    "langgraph>=0.2",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
extend-exclude = ["old"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = ["old"]

[tool.hatch.build.targets.wheel]
packages = ["app", "rag"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
