[project]
name = "backend"
version = "0.1.0"
description = "메리맵 백엔드 (FastAPI + SQLAlchemy 2.0 async + RAG 상담)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "azure-identity>=1.17",
    "azure-keyvault-secrets>=4.8",
    "openai>=1.40",
    "langgraph>=0.2",
    "langchain-core>=1.0",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    # app/services/oauth.py(소셜 로그인 토큰 교환/유저정보 조회)가 런타임에 직접 호출한다 —
    # 기존엔 dev extras(테스트 클라이언트 용도)에만 있었는데, 프로덕션 코드가 쓰게 되면서 승격.
    "httpx>=0.27",
    "langfuse>=4.0",
    # 애플 소셜로그인(15_post_v4_scope_promotion.md §P1) — client_secret을 ES256으로 직접
    # 서명(app/core/oauth_providers.py::build_apple_client_secret)하고, 애플이 돌려주는
    # id_token(RS256)을 애플 JWKS로 검증(app/services/oauth.py)하는 데 둘 다 필요하다. msal
    # (azure-identity 경유)의 전이 의존성으로 이미 lockfile에 있었지만, 코드가 직접 import하므로
    # 명시적 직접 의존성으로 승격 — 향후 azure-identity가 msal을 안 쓰게 바뀌어도 안 깨지도록.
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
extend-exclude = ["old"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# app/core/db.py의 엔진/세션팩토리는 프로세스 전역 싱글턴(실제 서버와 동일 설계) — 테스트마다
# 새 이벤트 루프(기본값)를 쓰면 asyncpg 커넥션이 다른 루프에서 재사용되며 깨진다
# ("cannot perform operation: another operation is in progress", 2026-08-24 chat 스모크
# 테스트 작성 중 재현). 세션 전체가 하나의 루프를 쓰게 맞춘다 — fixture와 test item 둘 다
# 설정해야 한다(pytest-asyncio는 이 둘을 별도 옵션으로 관리).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
norecursedirs = ["old"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
