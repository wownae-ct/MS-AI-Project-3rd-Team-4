title = "AI 홈트레이닝 코치 gitleaks 설정"

[extend]
useDefault = true

# 한글 문맥 평문 자격증명 탐지 (2026-08-19 추가).
# 이 저장소의 실제 유출은 문서의 "비밀번호(`값`)" 형태였는데, 기본 룰셋으로 전체 히스토리
# (46커밋)를 스캔해도 "no leaks found"였다 — 기본 룰은 영문 키워드(password= 등)와
# 고엔트로피 토큰 위주라 한글 문맥을 전혀 못 본다.
# entropy 필터를 일부러 안 쓴 이유: 실측 결과 실제 유출 값의 엔트로피(2.41)가
# 오탐 후보(AES-256-GCM 3.28, Standard_B2s 3.25)보다 오히려 낮았다. 임계값을 어디에 두든
# 진짜를 놓치거나 오탐만 남는 역선택이라, 문맥(키워드+인용부호)으로만 잡는다.
[[rules]]
id = "korean-plaintext-credential"
description = "한글 키워드(비밀번호·패스워드·암호) 근처 인용부호 안의 평문 자격증명"
# 값에서 `/`를 제외한 이유: 히스토리 실측에서 "비밀번호는 코드에 안 넣고 `infra/.env`"류의
# 경로 참조가 오탐 4건 중 2건이었다. 실제 유출 값에는 슬래시가 없음을 확인했다.
regex = '''(?:비밀번호|패스워드|암호)[^`'"\r\n]{0,20}[`'"]([^`'"\s/]{8,64})[`'"]'''
secretGroup = 1
keywords = ["비밀번호", "패스워드", "암호"]

# 순수 영단어(식별자)는 제외 — "비밀번호 인증과 병행(`authConfig`)"처럼 코드 식별자를
# 백틱으로 감싼 문서 표기가 오탐의 나머지 절반이었다. 진짜 비밀번호가 숫자·기호 없이
# 알파벳만으로 이뤄질 가능성은 이 팀의 실제 값 기준으로 없음을 확인했다(특수문자 포함).
[rules.allowlist]
regexTarget = "secret"
regexes = ['''^[A-Za-z]+$''']

[allowlist]
description = "오탐 예외"
paths = [
  # `.env.example`은 일부러 예외에서 뺐다(2026-08-19). 템플릿은 값이 비어 있어야 하므로
  # 오탐이 날 일이 거의 없고, 반대로 여기에 실제 값이 들어가면 추적 대상 파일이라 그대로
  # 커밋된다. 예외로 두면 gitleaks가 설계상 그걸 못 잡는다 — 이 저장소는 이미 문서에
  # 평문 비밀번호가 커밋된 전례가 있다(infra/시크릿-회전.md 참고).
  '''docs/.*\.(pdf|docx|xlsx|pptx|html)$''',
  '''uv\.lock$''',
]
