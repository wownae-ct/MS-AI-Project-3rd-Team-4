server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints /assets/* filenames by content hash, so a missing one must 404 —
    # never fall back to index.html here, or a stale client cache referencing an old hash
    # (iOS Safari caches HTML far more aggressively than desktop Chrome) gets served HTML
    # for a JS/CSS request, which browsers reject as a MIME type mismatch on module scripts.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
