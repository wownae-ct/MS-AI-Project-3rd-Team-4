# Key Vault CSI Driver로 시크릿을 파일로 마운트. vaultName/tenantId는 bicep 배포 후 교체.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
    name: backend-kv
spec:
    provider: azure
    parameters:
        usePodIdentity: "false"
        useVMManagedIdentity: "false"
        clientID: "2a104ab0-1f52-480c-89aa-57306cf7f85b"
        keyvaultName: "team4hc-kv"
        tenantId: "f2d17c51-f5c8-4e25-a029-7fee401686c2"
        objects: |
            array:
              - |
                objectName: openai-endpoint
                objectType: secret
              # openai-key: Azure OpenAI 리소스가 disableLocalAuth: true라 API 키가 아예 없음 —
              # backend는 Managed Identity(AAD 토큰)로 호출. 초기 설계(API 키 방식) 잔재였음, 제거함(2026-08-14).
              # pg-connstr: Postgres AAD 인증 방식 connection string — backend DB 코드가 아직 없어서
              # 정확한 형식(AAD 토큰 기반)을 지금 확정할 수 없음. backend/app/db/ 구현 시 다시 추가할 것.
              # (CSI 드라이버는 항목별 optional을 지원 안 해서 미확정 상태로 목록에 남겨두면 마운트 전체가 막힘.)
