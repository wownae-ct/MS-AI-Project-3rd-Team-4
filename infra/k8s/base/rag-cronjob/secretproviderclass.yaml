# Key Vault CSI Driver로 시크릿을 파일로 마운트. vaultName/tenantId는 bicep 배포 후 교체.
# 주의: infra/k8s/base/backend/secretproviderclass.yaml과 반드시 byte-identical 유지 — 같은
# 네임스페이스(staging/production)에 같은 이름(backend-kv) 오브젝트로 싱크되므로, 두 ArgoCD
# Application(backend-*, rag-cronjob-*)이 서로 다른 버전으로 self-heal하며 충돌하게 된다.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
    name: backend-kv
spec:
    provider: azure
    # openai-endpoint/pg-connstr을 네이티브 k8s Secret(backend-kv-secrets)으로도 동기화 — CSI
    # 드라이버가 마운트할 때 이 secretObjects를 보고 자동으로 만들어준다(AKS의
    # azureKeyvaultSecretsProvider 애드온 기본 기능, 추가 설정 불필요). 파일 마운트(/mnt/secrets)
    # 대신 이 방식을 쓰는 이유: 앱 코드가 os.environ.get("DATABASE_URL")처럼 일반 env var로
    # 읽게 해서 db/migrate.py의 로컬 개발 방식과 동일한 인터페이스를 유지하기 위함.
    secretObjects:
      - secretName: backend-kv-secrets
        type: Opaque
        data:
          - objectName: openai-endpoint
            key: AZURE_OPENAI_ENDPOINT
          - objectName: pg-connstr
            key: DATABASE_URL
          # 14_langfuse_tracing_design.md — Langfuse Cloud(Japan 리전) 프로젝트 키.
          - objectName: langfuse-public-key
            key: LANGFUSE_PUBLIC_KEY
          - objectName: langfuse-secret-key
            key: LANGFUSE_SECRET_KEY
          # 소셜 로그인(구글/네이버, 00_BASELINE.md §0-2 Should) — app/core/config.py의 4개
          # 필드가 기본값 없는 필수 항목이라, 이 4개가 Key Vault에 없으면 파드가
          # Settings() 인스턴스화 시점에 부팅 자체를 실패한다(소셜로그인만 안 되는 게 아니라
          # 백엔드 전체 다운) — az keyvault secret set으로 team4hc-kv에 실제 값 등록 먼저 필요.
          - objectName: google-client-id
            key: GOOGLE_CLIENT_ID
          - objectName: google-client-secret
            key: GOOGLE_CLIENT_SECRET
          - objectName: naver-client-id
            key: NAVER_CLIENT_ID
          - objectName: naver-client-secret
            key: NAVER_CLIENT_SECRET
          # 영수증 OCR 자동채움(2026-08-25 결정, payments) — storage.bicep이 배포 시점에
          # 직접 써넣는 blob endpoint(openai-endpoint와 동일 패턴, disableLocalAuth라 API 키가
          # 아니라 URL일 뿐).
          - objectName: storage-blob-endpoint
            key: AZURE_STORAGE_BLOB_ENDPOINT
    parameters:
        usePodIdentity: "false"
        useVMManagedIdentity: "false"
        clientID: "2a104ab0-1f52-480c-89aa-57306cf7f85b"
        keyvaultName: "team4hc-kv"
        tenantId: "f2d17c51-f5c8-4e25-a029-7fee401686c2"
        objects: |
            array:
              - |
                objectName: openai-endpoint
                objectType: secret
              - |
                objectName: pg-connstr
                objectType: secret
              - |
                objectName: langfuse-public-key
                objectType: secret
              - |
                objectName: langfuse-secret-key
                objectType: secret
              - |
                objectName: google-client-id
                objectType: secret
              - |
                objectName: google-client-secret
                objectType: secret
              - |
                objectName: naver-client-id
                objectType: secret
              - |
                objectName: naver-client-secret
                objectType: secret
              - |
                objectName: storage-blob-endpoint
                objectType: secret
              # openai-key: Azure OpenAI 리소스가 disableLocalAuth: true라 API 키가 아예 없음 —
              # backend는 Managed Identity(AAD 토큰)로 호출. 초기 설계(API 키 방식) 잔재였음, 제거함(2026-08-14).
