# model-version ConfigMap은 여기 없다 — infra/k8s/base/backend/kustomization.yaml 참고(같은 이유).
# CronJob은 매일 03:00 새 Pod로 뜨므로 Reloader 어노테이션 없이도 그날그날 최신 ConfigMap을 자연히 읽는다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - secretproviderclass.yaml
  - cronjob.yaml
