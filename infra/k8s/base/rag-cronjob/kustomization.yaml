# 주기적 RAG 재인덱싱 CronJob의 kustomize base — service account/secret/cronjob 리소스만 묶는다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - secretproviderclass.yaml
  - cronjob.yaml

# 코퍼스를 CronJob 파드에만 마운트 — backend Deployment는 DB만 조회하지 이 파일을 안 읽으므로
# Docker 이미지/빌드 컨텍스트는 안 건드린다. 콘텐츠가 바뀌면 kustomize가 해시 접미사 포함
# 이름으로 자동 재생성하고, 같은 kustomization 안의 cronjob.yaml volumes.configMap.name 참조도
# 자동으로 그 이름에 맞춰 치환된다.
#
# rag_corpus/ 하위 10개 파일은 data/rag_corpus/<DATASET_CODE>/<문서명>.json의 복사본이다(원본을
# kustomization 루트 밖에서 참조하면 --load-restrictor LoadRestrictionsNone이 필요한데, 이건
# 이 ArgoCD 인스턴스가 관리하는 모든 Application의 kustomize 빌드에 전역 적용되는 설정이라
# rag-cronjob 하나 때문에 클러스터 전체 기본 보안 수준을 낮출 만큼 이 문제가 크지 않다고
# 판단함, 2026-08-19). ConfigMap이 여러 파일을 담아도 마운트 시엔 디렉터리 구조 없이 평평하게
# 풀리므로(각 파일의 basename이 키가 됨, 10개 전부 이름이 겹치지 않아 안전), backend/app/rag/
# corpus.py의 load_corpus()는 로컬(중첩 디렉터리)·클러스터(평평한 디렉터리) 둘 다 동작하도록
# glob("*/*.json")이 아니라 rglob("*.json")을 쓴다(2026-08-21). 두 경로가 벌어지지 않게 CI에서
# diff로 검증한다(.github/workflows/backend-ci.yml의 corpus-sync-check) — 코퍼스를 고칠 땐 두
# 경로 다 갱신할 것. DS1_PRICE는 원래 대부분 price_benchmarks UPSERT 대상이라 RAG 코퍼스
# 밖이었지만, 2026-08-24 §P4에서 스키마에 안 맞는 두 시트만 예외로 RAG에 편입돼 여기도 처음
# 등장한다 — DS7_TIMELINE만 여전히 RAG 코퍼스 대상이 아니라 여기 없는 게 맞음.
configMapGenerator:
  - name: rag-corpus
    files:
      - rag_corpus/DS1_PRICE/2025_seasonal_price_and_contract_timing.json
      - rag_corpus/DS2_KCA/2026_consumer_damage_alert.json
      - rag_corpus/DS3_FTC/agency_10082.json
      - rag_corpus/DS3_FTC/dispute_resolution_2025_12_18.json
      - rag_corpus/DS3_FTC/venue_10030.json
      - rag_corpus/DS4_GOV/2024_wedding_service_support_plan.json
      - rag_corpus/DS5_DUO/2026_duo_wedding_cost_survey.json
      - rag_corpus/DS6_CHECK/checklist.json
      - rag_corpus/DS8_UGC/threads_reviews_2026_08.json
      - rag_corpus/DS8_UGC/threads_reviews_2026_08_p3.json
