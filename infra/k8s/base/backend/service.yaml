# ============================================================================
# [왕초보 가이드] Service란?
# 파드는 재시작될 때마다 내부 IP가 바뀐다 — 그래서 "IP로 직접 찾아가기"는 못 쓴다. Service는
# "app: backend 라벨이 붙은 파드들"을 대상으로 고정된 이름(backend)과 안정적인 가상 IP를
# 만들어주는 트래픽 분배기(로드밸런서)다. 다른 파드가 "backend"라는 이름으로만 요청을 보내면,
# Service가 그 순간 실제로 떠 있는(그리고 readinessProbe를 통과한) 파드로 알아서 연결해준다.
# ============================================================================
# backend Deployment 앞단 ClusterIP. 클러스터 밖 노출은 ingress(NGINX, 별도 설정 예정)가 담당.
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend # deployment.yaml의 template.metadata.labels와 같은 값 — 이 라벨이 붙은
      # 파드로만 트래픽을 보낸다. Deployment의 selector와는 별개 개념(둘 다 우연히 같은 라벨을
      # 쓸 뿐)이지만, 보통 같은 값으로 맞춰서 관리한다.
  ports:
    - port: 80 # Service 자체의 포트(클러스터 안에서 "backend:80"으로 접근할 때 쓰는 포트).
      targetPort: 8000 # 실제로 전달할 컨테이너 포트 — deployment.yaml의 containerPort와 일치해야 함.
  type: ClusterIP # 클러스터 "내부"에서만 접근 가능한 가상 IP를 만든다는 뜻. 외부(인터넷)에 이
      # 서비스를 노출하는 건 이 파일이 아니라 별도의 Ingress 리소스(ingress.yaml)가 담당한다 —
      # Ingress가 이 Service 이름(backend)을 목적지로 지정해 외부 요청을 여기로 연결한다.
