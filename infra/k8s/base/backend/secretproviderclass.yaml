# Key Vault CSI Driver로 시크릿을 파일로 마운트. vaultName/tenantId는 bicep 배포 후 교체.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<BACKEND_IDENTITY_CLIENT_ID>"
    keyvaultName: "<KEY_VAULT_NAME>"
    tenantId: "<AZURE_TENANT_ID>"
    objects: |
      array:
        - |
          objectName: openai-endpoint
          objectType: secret
        - |
          objectName: openai-key
          objectType: secret
        - |
          objectName: pg-connstr
          objectType: secret
