# Key Vault CSI Driver로 시크릿을 파일로 마운트. vaultName/tenantId는 bicep 배포 후 교체.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
    name: backend-kv
spec:
    provider: azure
    parameters:
        usePodIdentity: "false"
        useVMManagedIdentity: "false"
        clientID: "2a104ab0-1f52-480c-89aa-57306cf7f85b"
        keyvaultName: "team4hc-kv"
        tenantId: "f2d17c51-f5c8-4e25-a029-7fee401686c2"
        objects: |
            array:
              - |
                objectName: openai-endpoint
                objectType: secret
              - |
                objectName: openai-key
                objectType: secret
              - |
                objectName: pg-connstr
                objectType: secret
