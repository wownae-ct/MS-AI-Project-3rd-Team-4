# backend 서비스(gateway 진입점 + S3/S4/S5 에이전트가 한 프로세스에서 동작) 배포 매니페스트.
# 컨테이너 이미지 태그는 ArgoCD Image Updater가 ACR 신규 태그 감지 시 자동으로 갱신한다(수동 편집 불필요).
apiVersion: apps/v1
kind: Deployment
metadata:
    name: backend
    labels:
        app: backend
spec:
    replicas: 1
    selector:
        matchLabels:
            app: backend
    template:
        metadata:
            labels:
                app: backend
                azure.workload.identity/use: "true"
        spec:
            serviceAccountName: backend-sa
            containers:
                - name: backend
                  image: team4hcacr-drascbaqe8f2gcca.azurecr.io/backend:latest
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 8000
                  env:
                      - name: PORT
                        value: "8000"
                      - name: DATABASE_URL
                        valueFrom:
                            secretKeyRef:
                                name: backend-kv-secrets
                                key: DATABASE_URL
                      - name: DATABASE_AUTH_MODE
                        value: "aad"
                      - name: AZURE_OPENAI_ENDPOINT
                        valueFrom:
                            secretKeyRef:
                                name: backend-kv-secrets
                                key: AZURE_OPENAI_ENDPOINT
                  volumeMounts:
                      - name: kv-secrets
                        mountPath: /mnt/secrets
                        readOnly: true
                  readinessProbe:
                      httpGet:
                          # 앱에 /readyz가 없다 — 실제 라우트는 #1 GET /api/v1/health(03_API_spec.md
                          # §3, backend/app/routers/health.py) 하나뿐. 옛 경로로 뒀다가 새 파드가
                          # 계속 404로 readiness 실패해 크래시루프하는 걸 staging에서 실측 확인.
                          path: /api/v1/health
                          port: 8000
                      initialDelaySeconds: 5
                  livenessProbe:
                      httpGet:
                          path: /api/v1/health
                          port: 8000
                      initialDelaySeconds: 10
            volumes:
                - name: kv-secrets
                  csi:
                      driver: secrets-store.csi.k8s.io
                      readOnly: true
                      volumeAttributes:
                          secretProviderClass: backend-kv
