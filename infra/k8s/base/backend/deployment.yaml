# Deployment란?
# "이 컨테이너 이미지를, 이 개수만큼, 이렇게 설정해서 항상 떠 있게 해줘"라고 쿠버네티스에
# 선언하는 오브젝트. 파드(Pod, 컨테이너 1개 이상을 감싸는 최소 배포 단위)가 죽으면 쿠버네티스가
# 이 파일 내용대로 알아서 새로 띄워준다(사람이 매번 수동으로 재시작할 필요 없음) — 이게
# Deployment의 핵심 가치. 우리 서비스(메리맵 API)는 이 파일 하나로 "떠 있는 상태"가 정의된다.
# backend 서비스(gateway 진입점 + S3/S4/S5 에이전트가 한 프로세스에서 동작) 배포 매니페스트.
# 컨테이너 이미지 태그는 ArgoCD Image Updater가 ACR 신규 태그 감지 시 자동으로 갱신한다(수동 편집 불필요).
apiVersion: apps/v1
kind: Deployment
metadata:
    name: backend
    labels:
        app: backend
spec:
    replicas: 1 # 동시에 띄울 파드(컨테이너 묶음) 개수. 1이면 이중화가 없다는 뜻(장애 시 재시작
        # 되는 동안 잠깐 다운타임 발생) — 데모 규모라 의도적으로 1개만 유지.
    selector:
        # 아래 template으로 만들어지는 파드 중 "app: backend" 라벨이 붙은 것만 이 Deployment가
        # 관리 대상으로 인식한다. template.metadata.labels와 반드시 값이 일치해야 함(쿠버네티스
        # 규칙) — 안 맞으면 Deployment가 자기가 만든 파드를 못 찾아서 계속 새로 만들려고 함.
        matchLabels:
            app: backend
    template: # 파드의 "설계도" — Deployment는 이 template대로 파드를 실제로 찍어낸다.
        metadata:
            labels:
                app: backend
                azure.workload.identity/use: "true" # Azure Workload Identity 웹훅이 이 라벨
                    # 붙은 파드에만 개입해서 아래 volumes의 azure-identity-token을 자동 주입한다
                    # (Azure AD 토큰 없이는 Key Vault/Postgres/OpenAI 전부 인증 실패).
        spec:
            serviceAccountName: backend-sa # 이 파드가 "누구"로 행세할지(Azure AD 앱 등록과
                # 1:1로 연결된 K8s 신원). Workload Identity가 이 이름을 보고 어떤 Azure 신원의
                # 토큰을 발급할지 결정한다.
            containers:
                - name: backend
                  image: team4hcacr-drascbaqe8f2gcca.azurecr.io/backend:latest # 실행할 도커
                      # 이미지. GitHub Actions가 backend 브랜치 푸시마다 이 태그로 빌드·푸시하고,
                      # ArgoCD Image Updater가 주기적으로 감시하다가 새 이미지가 올라오면 여기를
                      # 자동으로 다시 배포한다(사람이 이 파일의 태그를 손으로 안 바꿔도 됨).
                  imagePullPolicy: Always # 태그가 항상 ":latest"라 캐시된 옛 이미지를 계속 쓰지
                      # 않도록 매번 새로 받아오게 강제.
                  ports:
                      - containerPort: 8000 # 컨테이너 안에서 앱(uvicorn)이 실제로 듣는 포트.
                  env: # 컨테이너 안 환경변수. 아래 secretKeyRef는 "K8s Secret이라는 오브젝트의
                      # 특정 키 값을 읽어와서 이 환경변수에 넣어라"는 뜻 — 값 자체는 이 파일에
                      # 없고 별도 시크릿 저장소(Key Vault → CSI 드라이버 → K8s Secret)에서 온다.
                      - name: PORT
                        value: "8000"
                      - name: DATABASE_URL
                        valueFrom:
                            secretKeyRef:
                                name: backend-kv-secrets
                                key: DATABASE_URL
                      - name: DATABASE_AUTH_MODE
                        value: "aad"
                      - name: AZURE_OPENAI_ENDPOINT
                        valueFrom:
                            secretKeyRef:
                                name: backend-kv-secrets
                                key: AZURE_OPENAI_ENDPOINT
                  volumeMounts:
                      - name: kv-secrets
                        mountPath: /mnt/secrets
                        readOnly: true
                  readinessProbe:
                      # readinessProbe = "이 파드가 지금 진짜 요청을 받아도
                      # 되는 상태인가?"를 쿠버네티스가 주기적으로 확인하는 헬스체크. 실패하면
                      # 이 파드는 Service(트래픽 분배기)에서 잠깐 빠진다(파드가 죽진 않음,
                      # 트래픽만 안 보냄) — 앱이 켜지는 중일 때 요청이 몰려서 에러 나는 걸 막아줌.
                      httpGet:
                          # 앱에 /readyz가 없다 — 실제 라우트는 #1 GET /api/v1/health(03_API_spec.md
                          # §3, backend/app/routers/health.py) 하나뿐. 옛 경로로 뒀다가 새 파드가
                          # 계속 404로 readiness 실패해 크래시루프하는 걸 staging에서 실측 확인.
                          path: /api/v1/health
                          port: 8000
                      initialDelaySeconds: 5
                  livenessProbe:
                      # livenessProbe = "이 파드가 아예 맛이 갔나?"를 확인하는
                      # 헬스체크. readinessProbe와 달리 이건 실패하면 쿠버네티스가 컨테이너를
                      # 강제로 죽이고 재시작시킨다(교착상태에 빠진 프로세스를 스스로 복구 못 할 때
                      # 대비) — 경로가 잘못돼 있으면 정상 앱도 계속 재시작만 반복하는 크래시루프에
                      # 빠지므로 readinessProbe보다 잘못 설정했을 때 더 치명적이다.
                      httpGet:
                          path: /api/v1/health
                          port: 8000
                      initialDelaySeconds: 10
            volumes:
                - name: kv-secrets
                  # 이건 "파일처럼 마운트되는 볼륨"인데 실제로는 디스크가 아니라
                  # Azure Key Vault를 CSI(Container Storage Interface) 드라이버로 연결한 것.
                  # 파드가 뜰 때 Workload Identity 토큰으로 Key Vault에 접속해서 비밀값을 읽어와
                  # /mnt/secrets 밑에 파일로 만들고, 동시에 위 env가 참조하는 K8s Secret
                  # (backend-kv-secrets)도 같이 만들어준다 — 시크릿 값을 이 YAML이나 git 어디에도
                  # 평문으로 안 둬도 되는 이유.
                  csi:
                      driver: secrets-store.csi.k8s.io
                      readOnly: true
                      volumeAttributes:
                          secretProviderClass: backend-kv
