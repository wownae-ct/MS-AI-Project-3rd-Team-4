# frontend 정적 빌드(Vite build 결과물, frontend/dist)를 nginx로 서빙하는 배포 매니페스트.
# backend/app/main.py의 CORS(SWA_ORIGIN_REGEX)는 그대로 유지 — PR 프리뷰(Azure Static Web
# Apps)와 로컬 개발은 계속 그 경로를 쓴다. 이 Deployment는 "실사용/데모 전용"으로 병행되는
# 별도 배포 경로다: 같은 AKS Ingress 호스트 아래 `/`로 프론트를, `/api`로 백엔드를 라우팅해
# 완전한 same-origin으로 만들어 사파리(ITP)/브레이브(Shields)의 서드파티 쿠키 차단을 근본적으로
# 우회한다(2026-08-26 결정, docs 참고). 컨테이너 이미지 태그는 backend와 동일하게 ArgoCD Image
# Updater가 ACR 신규 태그 감지 시 자동으로 갱신한다.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: frontend
    labels:
        app: frontend
spec:
    replicas: 1 # backend와 동일하게 데모 규모라 이중화 없음.
    selector:
        matchLabels:
            app: frontend
    template:
        metadata:
            labels:
                app: frontend
                # 정적 파일만 서빙하는 nginx라 Key Vault/Postgres/OpenAI 등 Azure 리소스에
                # 접근할 필요가 없다 — backend와 달리 Workload Identity 라벨/ServiceAccount가
                # 없다.
        spec:
            containers:
                - name: frontend
                  image: team4hcacr-drascbaqe8f2gcca.azurecr.io/frontend:staging-latest # 이 태그는
                      # placeholder — 실제 태그는 각 overlay(frontend-staging/frontend-production)
                      # kustomization.yaml의 `images:` 트랜스포머가 환경별로 덮어쓴다. VITE_API_BASE는
                      # Vite가 빌드타임에 정적 번들에 굽는 값이라 staging(nip.io)과 production
                      # (커스텀 도메인)이 서로 다른 API base를 가지려면 이미지 자체가 환경별로
                      # 따로 빌드돼야 한다(frontend-docker-ci.yml 참고) — backend처럼 런타임 env로
                      # 환경을 나눌 수 없는 이유.
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 80 # nginx 기본 포트 — 정적 파일만 서빙.
                  resources: # 2026-08-26 추가 — backend/deployment.yaml과 같은 이유(이전엔 필드
                      # 자체가 없어 BestEffort). 정적 파일만 서빙하는 nginx라 backend보다 훨씬
                      # 가볍다(실측 `kubectl top pod` 기준 ~1m CPU, ~8Mi 메모리) — 오토스케일러
                      # 없는 고정 2노드라 값을 올려도 비용 영향 없다.
                      requests:
                          cpu: 20m
                          memory: 32Mi
                      limits:
                          cpu: 100m
                          memory: 64Mi
                  readinessProbe:
                      httpGet:
                          path: /
                          port: 80
                      initialDelaySeconds: 5
                  livenessProbe:
                      httpGet:
                          path: /
                          port: 80
                      initialDelaySeconds: 10
