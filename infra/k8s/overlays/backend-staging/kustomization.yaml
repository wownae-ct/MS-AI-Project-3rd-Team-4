# backend 브랜치 -> staging 네임스페이스
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - namespace.yaml
  - ../../base/backend
  - ingress.yaml
patches:
  # 14_langfuse_tracing_design.md — base는 LANGFUSE_ENVIRONMENT를 안 두므로(staging/production이
  # 공유하는 계층이라 하드코딩 불가) 여기서 추가한다. env 배열엔 아직 이 이름이 없으므로
  # append이지 override가 아니다(중복 키 걱정 없음).
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LANGFUSE_ENVIRONMENT
          value: staging
