# Ingress 개념 자체는 ../backend-production/ingress.yaml 상단 주석 참고 — 이
# 파일은 프로덕션과 구조가 완전히 동일하고 host(도메인)만 다르다.
#
# 도메인: staging은 production과 같은 ingress-nginx 컨트롤러(같은 공인 IP)를 nip.io로 재사용한다
# (infra/k8s/ingress-nginx/README.md 참고). nip.io는 "IP 주소를 통째로 도메인처럼 쓰게 해주는"
# 무료 공개 DNS 서비스 — 예를 들어 20.1.2.3이라는 IP는 실제로 도메인을 사지 않아도
# "20-1-2-3.nip.io"라는 이름으로 그냥 resolve된다(해당 서비스가 뒤에서 IP를 그대로 돌려주는
# 방식). staging은 팀 내부 점검용이라 이렇게 임시 도메인으로 충분하고, production만 Azure가
# 공짜로 주는 "예쁜" 도메인(merrymap-production...)을 쓴다.
# ingress-nginx 설치 후 실제 IP를 확인해서 아래 호스트를
# "<IP를-하이픈으로-치환>.nip.io"로 채울 것 — 예: IP가 20.1.2.3이면 20-1-2-3.nip.io.
# TLS: cert-manager가 letsencrypt-nginx ClusterIssuer로 자동 발급(infra/k8s/cert-manager/README.md).
#
# 경로 분기(2026-08-26): 같은 호스트 아래 `/api`는 backend Service로, 그 외 전부(`/`)는 frontend
# Service(nginx 정적 서빙, base/frontend)로 보낸다 — 프론트·백엔드를 완전 same-origin으로 만들어
# 사파리(ITP)/브레이브(Shields)의 서드파티 쿠키 차단을 우회하기 위함(SWA cross-origin 배포는
# frontend-ci.yml이 PR 프리뷰용으로 계속 병행). ingress-nginx는 경로 길이 기준으로 더 구체적인
# 규칙을 우선 매칭하므로 `/api`가 `/`보다 항상 먼저 매치된다 — 선언 순서는 무관하지만 가독성을
# 위해 구체적인 규칙을 먼저 적는다.
#
# proxy-read-timeout/proxy-send-timeout(2026-08-26, 챗 SSE 타임아웃 회귀 수정): 어노테이션이
# 하나도 없으면 ingress-nginx 기본값(둘 다 60초)이 적용된다. 챗 그래프(backend/app/rag/graph.py,
# retrieve→generate→verify + CRAG 조건부 재시도)의 verify/reformulate_query 구간은 스트리밍이
# 없어 그 대기 중엔 SSE로 바이트가 하나도 안 나가는데, 이게 60초에 가까워지면 프록시가 먼저
# 커넥션을 끊어버려 사용자에게 "타임아웃 에러"로 보였다(backend가 자체적으로도 이제 verify/
# reformulate_query 대기 중 SSE heartbeat를 흘려보내지만, 그것과 별개로 프록시 쪽 여유도 둔다).
# 이 Ingress는 /api와 / 둘 다 같은 리소스라 어노테이션이 두 경로 모두에 적용되지만, 정적 파일
# 서빙(frontend)은 원래도 순식간에 끝나 상한이 늘어나도 영향이 없다. 120초로 정함 — 백엔드의
# settings.azure_openai_timeout_seconds(45초, backend/app/core/config.py)로 개별 LLM 호출을
# 하드 캡한 뒤에도, 여러 호출이 순차로 겹치는 챗 그래프 worst-case(최대 5회) 총 소요시간에
# 여유를 남기기 위해서다.
#
# proxy-body-size(2026-08-28, red-bug.md #8 실측 중 발견): 어노테이션이 없으면 ingress-nginx
# 기본값(1m)이 적용된다. 영수증 OCR(POST /payments/receipt-extract)은 백엔드 자체가 이미
# 15MB까지 허용하는데(app/routers/wedding/budget.py의 _MAX_RECEIPT_BYTES), 실제 휴대폰
# 카메라 사진은 1~5MB가 흔해 이 어노테이션 없이는 앱 로직까지 도달하기도 전에 nginx가
# "413 Request Entity Too Large"(순수 HTML, 프론트가 파싱 못 하는 형태)로 막고 있었다.
# 백엔드의 15MB 상한과 정확히 맞춰 16m(15MB + 약간의 여유)으로 둔다 — 더 낮게 잡으면 그
# 사이 구간(예: 5~15MB)에서 똑같은 종류의 불일치가 재현된다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "20-249-52-148.nip.io"
      secretName: backend-staging-tls
  rules:
    - host: "20-249-52-148.nip.io"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
