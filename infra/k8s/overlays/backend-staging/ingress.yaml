# Ingress 개념 자체는 ../backend-production/ingress.yaml 상단 주석 참고 — 이
# 파일은 프로덕션과 구조가 완전히 동일하고 host(도메인)만 다르다.
#
# 도메인: staging은 production과 같은 ingress-nginx 컨트롤러(같은 공인 IP)를 nip.io로 재사용한다
# (infra/k8s/ingress-nginx/README.md 참고). nip.io는 "IP 주소를 통째로 도메인처럼 쓰게 해주는"
# 무료 공개 DNS 서비스 — 예를 들어 20.1.2.3이라는 IP는 실제로 도메인을 사지 않아도
# "20-1-2-3.nip.io"라는 이름으로 그냥 resolve된다(해당 서비스가 뒤에서 IP를 그대로 돌려주는
# 방식). staging은 팀 내부 점검용이라 이렇게 임시 도메인으로 충분하고, production만 Azure가
# 공짜로 주는 "예쁜" 도메인(merrymap-production...)을 쓴다.
# ingress-nginx 설치 후 실제 IP를 확인해서 아래 호스트를
# "<IP를-하이픈으로-치환>.nip.io"로 채울 것 — 예: IP가 20.1.2.3이면 20-1-2-3.nip.io.
# TLS: cert-manager가 letsencrypt-nginx ClusterIssuer로 자동 발급(infra/k8s/cert-manager/README.md).
#
# 경로 분기(2026-08-26): 같은 호스트 아래 `/api`는 backend Service로, 그 외 전부(`/`)는 frontend
# Service(nginx 정적 서빙, base/frontend)로 보낸다 — 프론트·백엔드를 완전 same-origin으로 만들어
# 사파리(ITP)/브레이브(Shields)의 서드파티 쿠키 차단을 우회하기 위함(SWA cross-origin 배포는
# frontend-ci.yml이 PR 프리뷰용으로 계속 병행). ingress-nginx는 경로 길이 기준으로 더 구체적인
# 규칙을 우선 매칭하므로 `/api`가 `/`보다 항상 먼저 매치된다 — 선언 순서는 무관하지만 가독성을
# 위해 구체적인 규칙을 먼저 적는다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-nginx
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "20-249-52-148.nip.io"
      secretName: backend-staging-tls
  rules:
    - host: "20-249-52-148.nip.io"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
