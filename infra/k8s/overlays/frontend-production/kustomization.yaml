# main 브랜치 -> production 네임스페이스 (backend-production/kustomization.yaml과 동일 패턴).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - namespace.yaml
  - ../../base/frontend
# frontend-staging/kustomization.yaml과 동일한 이유 — 환경별 별개 이미지(값만 다름).
images:
  - name: team4hcacr-drascbaqe8f2gcca.azurecr.io/frontend
    newTag: production-latest
patches:
  # 2026-08-26 사용자 지시 — backend-production/kustomization.yaml과 대칭. staging은
  # base(replica=1) 그대로 두고 production만 이중화한다.
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
