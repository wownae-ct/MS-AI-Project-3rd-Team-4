apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rag-cronjob-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wownae-ct/MS-AI-Project-3rd-Team-4.git
    targetRevision: backend
    path: infra/k8s/overlays/rag-cronjob-staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
