apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-staging
  namespace: argocd
  annotations:
    # backend-production.yaml과 동일한 이유로 digest 전략 사용 (거기 주석 참고).
    argocd-image-updater.argoproj.io/image-list: backend=team4hcacr-drascbaqe8f2gcca.azurecr.io/backend:latest
    argocd-image-updater.argoproj.io/backend.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default
  # backend-production.yaml과 동일한 multi-source 구조 (거기 주석 참고).
  sources:
    - repoURL: https://github.com/wownae-ct/MS-AI-Project-3rd-Team-4.git
      targetRevision: backend
      path: infra/k8s/overlays/backend-staging
    - repoURL: https://github.com/wownae-ct/health-ml.git
      targetRevision: main
      path: k8s/model-version
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
