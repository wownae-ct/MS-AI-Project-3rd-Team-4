apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-staging
  namespace: argocd
  annotations:
    # backend-staging.yaml과 동일한 이유로 digest 전략 사용 (거기 주석 참고). 태그는 :latest가
    # 아니라 :staging-latest — overlays/frontend-staging/kustomization.yaml의 images 트랜스포머가
    # 실제로 배포하는 태그와 반드시 일치해야 Image Updater가 맞는 태그의 digest 변화를 감시한다.
    argocd-image-updater.argoproj.io/image-list: frontend=team4hcacr-drascbaqe8f2gcca.azurecr.io/frontend:staging-latest
    argocd-image-updater.argoproj.io/frontend.update-strategy: digest
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wownae-ct/MS-AI-Project-3rd-Team-4.git
    targetRevision: backend
    path: infra/k8s/overlays/frontend-staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
