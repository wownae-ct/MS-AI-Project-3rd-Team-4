apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rag-cronjob-production
  namespace: argocd
spec:
  project: default
  # backend-production.yaml과 동일한 multi-source 구조 — rag-cronjob도 같은 model-version ConfigMap을 읽는다.
  sources:
    - repoURL: https://github.com/wownae-ct/MS-AI-Project-3rd-Team-4.git
      targetRevision: main
      path: infra/k8s/overlays/rag-cronjob-production
    - repoURL: <ML_REPO_URL> # ml 레포 git URL로 교체할 것
      targetRevision: main
      path: k8s/model-version
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
