# main 브랜치는 PR 필수 + 리뷰 승인이 곧 "프로덕션 승인"이므로 머지 후 automated sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-production
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: backend=aicoachacr.azurecr.io/backend
    argocd-image-updater.argoproj.io/backend.update-strategy: latest
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wownae-ct/MS-AI-Project-3rd-Team-4.git
    targetRevision: main
    path: infra/k8s/overlays/backend-production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
