# ============================================================
# frontend same-origin 도커 이미지 CI/CD (2026-08-26)
#   docker build(환경별 2개) → ACR push
#   → 배포는 ArgoCD Image Updater가 ACR 신규 태그 감지해 자동 반영(backend-ci.yml과 동일 GitOps)
#
# 이 워크플로는 frontend-ci.yml(Azure Static Web Apps 배포, PR 프리뷰용)을 대체하지 않고
# 병행한다 — SWA는 계속 PR 프리뷰/로컬 크로스오리진 검증용, 이 경로는 AKS Ingress 아래
# same-origin으로 서빙되는 "실사용/데모 전용" 배포다(infra/k8s/base/frontend 참고).
#
# 태그가 2개인 이유: Vite는 VITE_API_BASE를 빌드타임에 정적 번들에 굽는다. staging(nip.io)과
# production(커스텀 도메인)은 서로 다른 호스트라 하나의 이미지로 공유할 수 없다 — backend처럼
# 런타임 env로 환경을 나눌 수 없다(base/frontend/deployment.yaml 주석 참고).
#
# 트리거: main 브랜치에 frontend/**가 바뀌었을 때만. frontend 브랜치엔 이 워크플로 파일 자체가
# 없어(.github/는 root config, backend 브랜치 소유) frontend 브랜치 푸시로는 못 켠다 — frontend
# 소스와 이 워크플로가 함께 존재하는 시점은 main 머지 이후뿐이라, staging/production 이미지 둘 다
# main 머지 시점에 같이 갱신된다(오늘(8/26) 마감 기준 단순화한 트레이드오프 — 별도 스테이징
# 파이프라인은 추후 필요해지면 frontend 브랜치에도 이 파일을 복사해서 push 트리거를 추가).
name: frontend-docker-ci

on:
    push:
        branches: [main]
        paths: ["frontend/**"]
    workflow_dispatch:

permissions:
    id-token: write # azure/login이 GitHub OIDC 토큰을 발급받게 허용
    contents: read

env:
    ACR_NAME: ${{ vars.ACR_NAME }}
    IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/frontend
    # same-origin 호스트 — infra/k8s/overlays/backend-{staging,production}/ingress.yaml의 host와
    # 문자 그대로 일치해야 한다(다르면 로그인 후 OAuth 리다이렉트/API 호출이 깨진다).
    STAGING_ORIGIN: https://20-249-52-148.nip.io
    PRODUCTION_ORIGIN: https://merrymap-production.koreacentral.cloudapp.azure.com

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@v7

            - name: Azure login (OIDC)
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            # backend-ci.yml과 동일한 이유(WSL/Windows az CLI 출력에 CR이 섞여 들어온 실측 사례) —
            # 값을 먼저 검증하고 명확히 실패시킨다.
            - name: 이미지 참조 값 검증
              run: |
                  set -euo pipefail
                  fail=0
                  for name in ACR_NAME IMAGE; do
                    value="${!name}"
                    if [ -z "$value" ]; then
                      echo "::error::$name 이 비어 있습니다 — 저장소 Variables를 확인하세요."
                      fail=1
                    elif printf '%s' "$value" | LC_ALL=C grep -qP '[\x00-\x1f\x7f]'; then
                      echo "::error::$name 에 제어문자가 섞여 있습니다(CR 등). 값을 다시 등록하세요."
                      fail=1
                    else
                      echo "OK: $name = $value"
                    fi
                  done
                  exit "$fail"

            - name: ACR 로그인
              run: az acr login --name "${{ env.ACR_NAME }}"

            # 커밋 SHA로도 태그 → 어떤 커밋이 배포됐는지 ArgoCD Application에서 바로 추적 가능.
            # Dockerfile은 VITE_API_BASE를 build-arg로 받아 `npm run build` 전에 env로 주입한다
            # (frontend/Dockerfile, 프론트 쪽 구현 — 이 워크플로는 그 계약에 의존).
            - name: staging 이미지 빌드 & 푸시
              env:
                  DOCKER_BUILDKIT: "1"
              run: |
                  docker build \
                    --build-arg VITE_API_BASE="${{ env.STAGING_ORIGIN }}" \
                    -t "${{ env.IMAGE }}:staging-${{ github.sha }}" \
                    -t "${{ env.IMAGE }}:staging-latest" \
                    -f frontend/Dockerfile ./frontend
                  docker push "${{ env.IMAGE }}:staging-${{ github.sha }}"
                  docker push "${{ env.IMAGE }}:staging-latest"

            - name: production 이미지 빌드 & 푸시
              env:
                  DOCKER_BUILDKIT: "1"
              run: |
                  docker build \
                    --build-arg VITE_API_BASE="${{ env.PRODUCTION_ORIGIN }}" \
                    -t "${{ env.IMAGE }}:production-${{ github.sha }}" \
                    -t "${{ env.IMAGE }}:production-latest" \
                    -f frontend/Dockerfile ./frontend
                  docker push "${{ env.IMAGE }}:production-${{ github.sha }}"
                  docker push "${{ env.IMAGE }}:production-latest"
