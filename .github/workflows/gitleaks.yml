name: gitleaks

on:
  push:
    branches: [main] # 최종 안전망 — feature/backend/frontend push마다 도는 건 낭비(로컬 pre-commit 훅이 이미 걸러줌)
  pull_request: # 모든 PR(머지 게이트) — main 브랜치 보호 규칙의 required check

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 개인(User) 소유 리포는 gitleaks-action이 무료로 동작한다 (조직 리포는 라이선스 필요).
      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
