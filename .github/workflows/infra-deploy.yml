# 전제조건 — infra/README.md "필요한 GitHub 설정" 참고:
#   1. GitHub Secrets: AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID (OIDC 페더레이션, 없으면 azure/login 실패)
#      + POSTGRES_ADMIN_PASSWORD (없으면 dev.bicepparam이 CHANGE_ME_LOCAL_ONLY로 폴백돼 배포 실패)
#      + GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / NAVER_CLIENT_ID / NAVER_CLIENT_SECRET(소셜 로그인,
#        00_BASELINE.md §0-2 Should — 없으면 CHANGE_ME_LOCAL_ONLY로 폴백돼 파드는 뜨지만 로그인은 안 됨)
#      + LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY(14_langfuse_tracing_design.md — ⚠️ 이미 라이브로
#        쓰이는 값이라 GitHub Secrets에 실제 값을 등록하기 전에는 workflow_dispatch로 whatIf:false
#        실배포를 돌리지 말 것. 없으면 CHANGE_ME_LOCAL_ONLY로 덮어써서 기존 트레이싱이 깨진다)
#   2. GitHub Variables: AZURE_RG (리소스그룹, az group create로 먼저 만들어야 함), NAME_PREFIX(필수 — 없으면
#      dev.bicepparam이 BCP427로 바로 실패), POSTGRES_ADMIN_LOGIN(선택, 없으면 pgadmin으로 폴백),
#      CLUSTER_ADMIN_OBJECT_IDS(선택, 쉼표구분 GUID)
name: infra-deploy

on:
  workflow_dispatch:
    inputs:
      whatIf:
        description: 'true면 what-if만 실행(실배포 없음)'
        type: boolean
        default: true
  pull_request:
    paths: ['infra/bicep/**']

permissions:
  id-token: write
  contents: read

jobs:
  bicep:
    runs-on: ubuntu-latest
    env:
      NAME_PREFIX: ${{ vars.NAME_PREFIX }}
      DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT }}
      POSTGRES_ADMIN_LOGIN: ${{ vars.POSTGRES_ADMIN_LOGIN }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      CLUSTER_ADMIN_OBJECT_IDS: ${{ vars.CLUSTER_ADMIN_OBJECT_IDS }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Bicep build (검증)
        run: az bicep build --file infra/bicep/main.bicep
      - name: What-if
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RG }}" \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/params/dev.bicepparam
      - name: Deploy
        if: github.event_name == 'workflow_dispatch' && inputs.whatIf == false
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RG }}" \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/params/dev.bicepparam
