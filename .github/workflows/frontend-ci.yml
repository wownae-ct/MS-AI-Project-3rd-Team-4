# ============================================================
# frontend CI/CD
#   npm build (러너에서 직접) → Azure Static Web Apps 배포
#
# 트리거: frontend 브랜치에 frontend/** 가 바뀌었을 때만
# 인증 방식: 배포 토큰(deployment token) — OIDC 아님, backend-ci.yml과 별개 시크릿
#
# 주의:
#   SWA 배포 액션에 빌드까지 맡기면 내부 Oryx 빌드 컨테이너에서 실행되는데
#   거기엔 위 env(VITE_API_BASE 등)가 전달되지 않아 빌드 결과물에 값이 안 박힌다.
#   그래서 빌드는 반드시 이 러너에서 직접 하고, 배포 액션은 결과물만 업로드한다
#   (skip_app_build: true).
# ============================================================
name: frontend-ci

on:
    # paths 에 이 워크플로 자신을 포함한다 — 없으면 이 파일을 고쳐도 CI 가 돌지 않아
    # 변경이 검증되지 않은 채 머지된다. 모노레포에서 워크플로 파일을 paths 에 넣는 것은
    # SWA 공식 문서의 권장 구성이다(build-configuration.md 「Monorepo support」).
    pull_request:
        types: [opened, synchronize, reopened, closed]
        paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
    push:
        branches: [frontend]
        paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
    workflow_dispatch:

jobs:
    build_and_deploy:
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        runs-on: ubuntu-latest
        # 실측 총 소요는 약 90초다(2026-08-20 실행). 기본값은 360분이라 매달린 작업 하나가 6시간을 태운다.
        timeout-minutes: 15
        # 같은 PR 에 연속 푸시가 오면 앞 실행을 취소한다 — 프리뷰 슬롯 하나에 배포가 겹치는 것을 막고
        # 러너 분을 아낀다. frontend 브랜치 배포는 event_name 이 push 라 이 식이 false 가 되어 절대 취소되지 않는다.
        concurrency:
            group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: ${{ github.event_name == 'pull_request' }}
        permissions:
            contents: read
            pull-requests: write # PR 프리뷰 배포 상태 코멘트에 필요
        defaults:
            run:
                working-directory: frontend
        steps:
            # 액션 런타임을 node24 로 — Node 20 런타임은 2026-06-16 이후 강제 상향 상태이고 2026 가을에 제거된다.
            # main·backend 는 3d2f781 이 이미 @v7 로 올렸고, 그 커밋이 "프론트 담당자가 feature/frontend 에
            # 같은 2줄 수정을 해야 효과가 생긴다"고 이 사본의 수정을 넘겼다. 아래 node-version 과는 별개 축이다
            # (그건 앱을 빌드할 Node 이고, 이건 액션 자체가 실행되는 런타임이다).
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  # 버전은 frontend/.nvmrc가 단일 출처 — 로컬과 CI가 갈라지지 않게 값을 중복하지 않는다.
                  # 하한 근거: jsdom 30.0.1 engines = ^22.22.2 || ^24.15.0 || >=26.0.0 (전 의존성 중 최협)
                  # 상세: frontend/docs/architecture/toolchain.md §2
                  node-version-file: frontend/.nvmrc
                  cache: npm
                  # 락파일이 하위 디렉터리라 명시 필요 (setup-node는 defaults.run.working-directory를 따르지 않는다)
                  cache-dependency-path: frontend/package-lock.json

            - name: Install
              run: npm ci

            # ---- 검증 게이트 — 통과 못하면 빌드/배포 안 함 ----
            # --if-present를 쓰지 않는다: 스크립트가 사라져도 성공으로 처리되어 게이트가 조용히 없어진다.
            - name: Typecheck
              run: npm run typecheck

            # oxlint은 검사 대상이 0개면(경로 오류·ignore 과다) 스스로 exit 1로 실패한다 — 실측 확인.
            # 별도의 "검사 파일 수 > 0" 게이트가 필요 없는 이유다 (toolchain.md §5.3 ②).
            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Build
              env:
                  VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
                  IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
              run: |
                  # 포크에서 온 PR에는 secret이 전달되지 않는다(GitHub 사양) — 빌드 검증 자체는 계속 되어야
                  # 하므로 더미 오리진으로 대체한다. 반면 같은 저장소 브랜치(push · non-fork PR)인데 값이
                  # 비어 있으면 시크릿 미설정이라는 뜻이고, 그 산출물이 배포되면 실제로 호출할 곳이 없다 —
                  # `?? ""` 식 조용한 폴백을 두지 않고 여기서 바로 실패시킨다(전송 계층의 VITE_API_BASE
                  # 형식 게이트가 빌드 시점에 값을 요구하므로, 비워 두면 이 단계가 어차피 실패한다).
                  if [ -z "$VITE_API_BASE" ]; then
                    if [ "$IS_FORK_PR" = "true" ]; then
                      echo "::warning::VITE_API_BASE가 비어 있다 — 포크 PR이라 시크릿이 전달되지 않는다. 빌드 검증용 더미 오리진을 쓴다."
                      export VITE_API_BASE="https://fork-pr.invalid"
                    else
                      echo "::error::VITE_API_BASE가 비어 있다 — 저장소 시크릿 미설정. 이 산출물은 배포돼도 API 를 호출할 곳이 없다."
                      exit 1
                    fi
                  fi
                  npm run build

            - name: Deploy to Azure Static Web Apps
              if: github.ref == 'refs/heads/frontend' || github.event_name == 'pull_request'
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  action: upload
                  app_location: frontend/dist
                  skip_app_build: true

    close_pull_request:
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - name: Close PR preview environment
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
                  action: close
