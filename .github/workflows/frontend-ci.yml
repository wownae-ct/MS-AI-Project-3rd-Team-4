# ============================================================
# frontend CI/CD
#   npm build (러너에서 직접) → Azure Static Web Apps 배포
#
# 트리거: frontend 브랜치에 frontend/** 가 바뀌었을 때만
# 인증 방식: 배포 토큰(deployment token) — OIDC 아님, backend-ci.yml과 별개 시크릿
#
# 주의:
#   SWA 배포 액션에 빌드까지 맡기면 내부 Oryx 빌드 컨테이너에서 실행되는데
#   거기엔 위 env(VITE_API_BASE 등)가 전달되지 않아 빌드 결과물에 값이 안 박힌다.
#   그래서 빌드는 반드시 이 러너에서 직접 하고, 배포 액션은 결과물만 업로드한다
#   (skip_app_build: true).
# ============================================================
name: frontend-ci

on:
    pull_request:
        types: [opened, synchronize, reopened, closed]
        paths: ["frontend/**"]
    push:
        branches: [frontend]
        paths: ["frontend/**"]
    workflow_dispatch:

jobs:
    build_and_deploy:
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write # PR 프리뷰 배포 상태 코멘트에 필요
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  # 버전은 frontend/.nvmrc가 단일 출처 — 로컬과 CI가 갈라지지 않게 값을 중복하지 않는다.
                  # 하한 근거: jsdom 30.0.1 engines = ^22.22.2 || ^24.15.0 || >=26.0.0 (전 의존성 중 최협)
                  # 상세: frontend/docs/architecture/toolchain.md §2
                  node-version-file: frontend/.nvmrc
                  cache: npm
                  # 락파일이 하위 디렉터리라 명시 필요 (setup-node는 defaults.run.working-directory를 따르지 않는다)
                  cache-dependency-path: frontend/package-lock.json

            - name: Install
              run: npm ci

            # ---- 검증 게이트 — 통과 못하면 빌드/배포 안 함 ----
            # --if-present를 쓰지 않는다: 스크립트가 사라져도 성공으로 처리되어 게이트가 조용히 없어진다.
            - name: Typecheck
              run: npm run typecheck

            # oxlint은 검사 대상이 0개면(경로 오류·ignore 과다) 스스로 exit 1로 실패한다 — 실측 확인.
            # 별도의 "검사 파일 수 > 0" 게이트가 필요 없는 이유다 (toolchain.md §5.3 ②).
            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Build
              env:
                  VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
              run: |
                  # 포크에서 온 PR에는 secret이 전달되지 않는다(GitHub 사양). 지금은 이 값을 **읽는 코드가 없다**
                  # (전송 계층이 주제 전환으로 삭제됨 — toolchain.md §6.3). 경고를 남겨 두는 이유는 전송 계층이
                  # 돌아왔을 때 `?? ""` 같은 조용한 폴백을 다시 들이지 않도록 부재를 눈에 보이게 하기 위해서다.
                  if [ -z "$VITE_API_BASE" ]; then
                    echo "::warning::VITE_API_BASE가 비어 있다 — 포크 PR이거나 시크릿 미설정. API 호출이 상대 경로로 나간다."
                  fi
                  npm run build

            - name: Deploy to Azure Static Web Apps
              if: github.ref == 'refs/heads/frontend' || github.event_name == 'pull_request'
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
                  repo_token: ${{ secrets.GITHUB_TOKEN }}
                  action: upload
                  app_location: frontend/dist
                  skip_app_build: true

    close_pull_request:
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Close PR preview environment
              uses: Azure/static-web-apps-deploy@v1
              with:
                  azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
                  action: close
