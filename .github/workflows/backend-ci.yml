# ============================================================
# backend CI/CD
#   ruff lint → pytest(uv) → 도커 빌드 → ACR push
#   → 배포는 ArgoCD Image Updater가 ACR 신규 태그를 감지해 자동 반영
#   (Container Apps 프로젝트와 달리 az containerapp update 같은
#    직접 배포 스텝이 없다 — GitOps라 여기선 이미지만 만들어 올린다)
#
# 트리거: backend 브랜치에 backend/** 가 바뀌었을 때만
#   (feature/backend-* → PR → backend 머지 = 이 워크플로 실행)
# ============================================================
name: backend-ci

on:
    pull_request:
        paths:
            [
                "backend/**",
                "data/**",
                "db/**",
            ]
    push:
        branches: [backend]
        paths: ["backend/**"]
    workflow_dispatch:

permissions:
    id-token: write # azure/login이 GitHub OIDC 토큰을 발급받게 허용
    contents: read

env:
    ACR_NAME: ${{ vars.ACR_NAME }}
    IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/backend

jobs:
    # data/rag_corpus/(정본, 8개 json)와 infra/k8s/base/rag-cronjob/rag_corpus/(ConfigMap 소스
    # 복사본)가 벌어지지 않게 diff로 검증한다 — LoadRestrictionsNone을 켜지 않기로 한 결정
    # (infra/k8s/base/rag-cronjob/kustomization.yaml 참고) 때문에 코퍼스를 kustomization 루트
    # 안에 물리적으로 복사해둬야 해서, 둘이 따로 놀 위험이 항상 있다. .md는 비교 대상 아님
    # (참고용으로만 원본 쪽에 남아있고 ConfigMap에는 안 들어감).
    corpus-sync-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: RAG 코퍼스 원본↔ConfigMap 복사본 diff 검증
              run: |
                  diff -rq -x '*.md' data/rag_corpus infra/k8s/base/rag-cronjob/rag_corpus

    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        # 2026-08-24부터 tests/conftest.py가 실제 ASGI 앱(app.main)을 띄우는 스모크 테스트를
        # 돌린다 — app.core.config.Settings의 필수 필드(database_url/azure_openai_endpoint)가
        # 없으면 앱이 아예 안 뜬다. 이전엔 서비스 함수만 단위 테스트해서 CI에 DB가 없어도
        # 문제가 없었는데, 이제는 실제 Postgres가 있어야 한다 — 09_backend_implementation_plan.md
        # §4가 명시한 "CI 내 임시 DB" 옵션을 여기서 쓴다. pgvector/pgvector 이미지를 쓰는 이유는
        # rag_chunks.embedding VECTOR(1536) 컬럼 마이그레이션(66e6da86e72e)이 `CREATE EXTENSION
        # vector`를 실행하는데, 일반 postgres 이미지엔 그 확장 파일 자체가 없어서 실패한다.
        # AZURE_OPENAI_ENDPOINT는 스모크 테스트가 실LLM을 호출하지 않아(비용/지연 때문에
        # 의도적으로 제외 — tests/test_smoke.py 상단 docstring 참고) 더미 값으로 충분하다.
        services:
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: merrymap_ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/merrymap_ci
            AZURE_OPENAI_ENDPOINT: https://ci-dummy-not-called.openai.azure.com/
        steps:
            - uses: actions/checkout@v7

            - name: Install uv
              uses: astral-sh/setup-uv@v10.0.1

            # --locked: uv.lock이 pyproject.toml과 일치함을 단언한다. 누군가 의존성을 추가하고
            # `uv lock`을 다시 돌리지 않으면 여기서 exit 1로 막힌다 — 락을 커밋하는 목적인
            # "로컬과 CI가 같은 버전"을 실제로 보장하는 건 이 플래그다.
            # --frozen을 쓰면 안 된다: 락이 낡아도 exit 0으로 조용히 통과해서(실측 확인),
            # pyproject에만 추가된 패키지가 설치되지 않은 채 CI가 초록불이 된다.
            - name: Sync dependencies
              run: uv sync --extra dev --locked

            # 린트 게이트 — 통과 못하면 테스트/빌드 안 함
            - name: Lint
              run: uv run ruff check .

            # 스모크 테스트가 실제 테이블에 대해 돌므로 마이그레이션을 먼저 적용해야 한다.
            - name: Run DB migrations
              run: uv run alembic upgrade head

            # 테스트 게이트 — 통과 못하면 이미지 빌드 안 함
            # 아직 테스트가 하나도 없으면 pytest가 exit code 5(수집된 테스트 없음)로 죽는데,
            # 이건 "테스트 실패"가 아니라 "테스트가 아직 없음"이므로 통과 처리한다.
            # 첫 테스트가 생기면 이 관용 처리는 자연히 의미가 없어진다(정상 실행됨).
            - name: Test
              run: |
                  uv run pytest -q || {
                    code=$?
                    if [ "$code" -eq 5 ]; then
                      echo "::warning::수집된 테스트가 없습니다 (아직 정상 — 테스트 작성 시작하면 이 경고는 사라집니다)"
                      exit 0
                    fi
                    exit "$code"
                  }

    build-and-push:
        needs: [test, corpus-sync-check]
        if: github.ref == 'refs/heads/backend'
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@v7

            - name: Azure login (OIDC)
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            # GitHub Variables에 눈에 안 보이는 제어문자가 섞여 들어오는 걸 여기서 막는다.
            # 2026-08-19에 실제로 났다 — WSL에서 Windows용 az CLI로 값을 뽑아 넣는 바람에
            # ACR_LOGIN_SERVER 끝에 CR이 붙었고, docker가 이렇게 죽었다:
            #   invalid tag "...azurecr.io\r/backend:<sha>": invalid reference format
            # 에러 메시지만으로는 원인을 짐작하기 어려우니 값을 먼저 검증하고 명확히 실패시킨다.
            - name: 이미지 참조 값 검증
              run: |
                  set -euo pipefail
                  fail=0
                  for name in ACR_NAME IMAGE; do
                    value="${!name}"
                    if [ -z "$value" ]; then
                      echo "::error::$name 이 비어 있습니다 — 저장소 Variables를 확인하세요."
                      fail=1
                    elif printf '%s' "$value" | LC_ALL=C grep -qP '[\x00-\x1f\x7f]'; then
                      echo "::error::$name 에 제어문자가 섞여 있습니다(CR 등). 값을 다시 등록하세요:"
                      echo "::error::  gh variable set ACR_LOGIN_SERVER --body \"\$(az acr show -n <ACR_NAME> --query loginServer -o tsv | tr -d '\r')\""
                      printf '%s' "$value" | od -c | head -3
                      fail=1
                    else
                      echo "OK: $name = $value"
                    fi
                  done
                  exit "$fail"

            # 커밋 SHA로 태그 → 어떤 커밋이 배포됐는지 ArgoCD Application에서 바로 추적 가능
            - name: Build & push image
              env:
                  # Dockerfile이 `RUN --mount=type=cache`를 쓰는데 이건 BuildKit 전용 문법이다.
                  # 러너 기본값에 기대지 않고 명시한다 — 꺼져 있으면 빌드가 문법 에러로 죽는다.
                  DOCKER_BUILDKIT: "1"
              run: |
                  az acr login --name "${{ env.ACR_NAME }}"
                  docker build -t "${{ env.IMAGE }}:${{ github.sha }}" -t "${{ env.IMAGE }}:latest" ./backend
                  docker push "${{ env.IMAGE }}:${{ github.sha }}"
                  docker push "${{ env.IMAGE }}:latest"
