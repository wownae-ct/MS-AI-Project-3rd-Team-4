# ============================================================
# frontend same-origin 도커 이미지 CI/CD — staging 전용 (2026-08-26, root-app 분리에 맞춰 신규)
#   docker build → ACR push (:staging-latest)
#   → 배포는 ArgoCD Image Updater가 ACR 신규 태그 감지해 자동 반영(backend-ci.yml과 동일 GitOps)
#
# backend.yml의 backend-ci.yml이 backend 브랜치 push마다 새 이미지를 빌드하는 것과 대칭 —
# production 전용 `.github/workflows/frontend-docker-ci.yml`(backend/main 브랜치 소유, main
# push 트리거)과 짝을 이룬다. `.github/`는 backend/frontend 양쪽 브랜치 PR에서 다 허용되는
# 경로라(path-guard) 두 워크플로 파일이 서로 다른 브랜치에 나눠 존재할 수 있다 — 이 파일은
# frontend 브랜치에만 존재해서 frontend push로 켜지고, production용 파일은 backend/main에만
# 존재해서 main push로 켜진다.
#
# 이미지가 환경별로 따로인 이유: Vite는 VITE_API_BASE를 빌드타임에 정적 번들에 굽는다.
# staging(nip.io)과 production(커스텀 도메인)은 서로 다른 호스트라 하나의 이미지로 공유할 수
# 없다(infra/k8s/base/frontend/deployment.yaml 주석 참고, backend/infra 쪽에서만 볼 수 있음).
name: frontend-docker-ci-staging

on:
    push:
        branches: [frontend]
        paths: ["frontend/**"]
    workflow_dispatch:

permissions:
    id-token: write # azure/login이 GitHub OIDC 토큰을 발급받게 허용
    contents: read

env:
    ACR_NAME: ${{ vars.ACR_NAME }}
    IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/frontend
    # same-origin 호스트 — infra/k8s/overlays/backend-staging/ingress.yaml의 host와 문자 그대로
    # 일치해야 한다(다르면 로그인 후 OAuth 리다이렉트/API 호출이 깨진다).
    STAGING_ORIGIN: https://20-249-52-148.nip.io

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@v7

            - name: Azure login (OIDC)
              uses: azure/login@v3
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            # backend-ci.yml과 동일한 이유(WSL/Windows az CLI 출력에 CR이 섞여 들어온 실측 사례) —
            # 값을 먼저 검증하고 명확히 실패시킨다.
            - name: 이미지 참조 값 검증
              run: |
                  set -euo pipefail
                  fail=0
                  for name in ACR_NAME IMAGE; do
                    value="${!name}"
                    if [ -z "$value" ]; then
                      echo "::error::$name 이 비어 있습니다 — 저장소 Variables를 확인하세요."
                      fail=1
                    elif printf '%s' "$value" | LC_ALL=C grep -qP '[\x00-\x1f\x7f]'; then
                      echo "::error::$name 에 제어문자가 섞여 있습니다(CR 등). 값을 다시 등록하세요."
                      fail=1
                    else
                      echo "OK: $name = $value"
                    fi
                  done
                  exit "$fail"

            - name: ACR 로그인
              run: az acr login --name "${{ env.ACR_NAME }}"

            # 커밋 SHA로도 태그 → 어떤 커밋이 배포됐는지 ArgoCD Application에서 바로 추적 가능.
            - name: staging 이미지 빌드 & 푸시
              env:
                  DOCKER_BUILDKIT: "1"
              run: |
                  docker build \
                    --build-arg VITE_API_BASE="${{ env.STAGING_ORIGIN }}" \
                    -t "${{ env.IMAGE }}:staging-${{ github.sha }}" \
                    -t "${{ env.IMAGE }}:staging-latest" \
                    -f frontend/Dockerfile ./frontend
                  docker push "${{ env.IMAGE }}:staging-${{ github.sha }}"
                  docker push "${{ env.IMAGE }}:staging-latest"
